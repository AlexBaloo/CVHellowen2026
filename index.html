<!DOCTYPE html>

<title>Черная комната. Звуковая панель.</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f2f2f2;
}

.layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
}

.panel {
    flex: 2;
}

.scenario-panel {
    flex: 1;
    min-width: 300px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    position: sticky;
    top: 20px;
	height: 90vh;
    overflow-y: auto;
}

.scenario-content {
    line-height: 1.5;
    white-space: pre-wrap;
}

h1 {
    text-align: center;
}

.track {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
}

.controls {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 3px;
}

button {
    min-width: 50px;
    padding: 5px 10px;
    cursor: pointer;
}

.description {
    flex-grow: 1;
    font-weight: bold;
}

.status {
    min-width: 120px;
    font-size: 14px;
}

.progress-container {
    display: flex;
    align-items: center;
    gap: 10px;
}

.progress {
    flex-grow: 1;
    height: 18px;
}

.time {
    min-width: 110px;
    text-align: right;
    font-size: 13px;
}

.master-player {
    position: sticky;
    top: 0;
    z-index: 1000;

    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 20px;

    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.master-player h2 {
    margin-top: 0;
}

.master-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

#masterVolume {
    width: 200px;
}

.master-progress-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
}

#masterProgress {
    flex: 1;
    height: 20px;
}

#masterTime {
    min-width: 110px;
    text-align: right;
    font-size: 13px;
}
</style>
</head>
<body>

<div class="layout">

    <div class="panel">	
	
	<h1>Звуковая панель</h1>

		<!-- Фоновая дорожка -->
		<div class="master-player">
			<h2>Фоновая дорожка</h2>

			<div class="master-controls">
				<button id="masterPlay">▶ Play</button>
				<button id="masterPause">⏸ Pause</button>
				<button id="masterStop">⏹ Stop</button>

				<label for="masterVolume">Громкость:</label>

				<input
					type="range"
					id="masterVolume"
					min="0"
					max="100"
					value="50">

				<span id="masterVolumeValue">50%</span>
			</div>
			<br>
			<div class="master-progress-container">
			<progress
				id="masterProgress"
				value="0"
				max="100">
			</progress>

			<span id="masterTime">
				00:00 / 00:00
			</span>
			</div>
		</div>

		<!-- Список звуков -->
		<div id="soundboard"></div>
	</div>
    <div class="scenario-panel">
        <h1>Сценарий</h1>

        <div class="scenario-content">

        </div>
	</div>

</div>

    { file: "2.mp3",  description: "Госпожа проведет вас"  },

    { file: "5.mp3",  description: "Представление начинается!"  },
    { file: "6.mp3",  description: "Вход в цирк завален. И чтобы попасть на арену, вам предстоит сначала спуститься в подземелье и затем проползти по тоннелю. Вперед!"  },

function formatTime(seconds) {
    if (isNaN(seconds)) return "00:00";

    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);

    return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

// Общая звуковая дорожка
const masterAudio = new Audio('background.mp3');

masterAudio.volume = 0.5;
masterAudio.loop = true;

const masterPlay =
    document.getElementById('masterPlay');

const masterStop =
    document.getElementById('masterStop');

const masterVolume =
    document.getElementById('masterVolume');

const masterVolumeValue =
    document.getElementById('masterVolumeValue');

masterPlay.addEventListener('click', () => {
    masterAudio.play();
});

masterStop.addEventListener('click', () => {
    masterAudio.pause();
    masterAudio.currentTime = 0;
});

masterVolume.addEventListener('input', () => {
    const volume = masterVolume.value / 100;

    masterAudio.volume = volume;
    masterVolumeValue.textContent =
        masterVolume.value + '%';
});

const container = document.getElementById('soundboard');

playlist.forEach(trackInfo => {

    const audio = new Audio(`Voice2/${trackInfo.file}`);

    const row = document.createElement('div');
    row.className = 'track';

    const controls = document.createElement('div');
    controls.className = 'controls';

    const playBtn = document.createElement('button');
    playBtn.textContent = 'Play';

    const stopBtn = document.createElement('button');
    stopBtn.textContent = 'Stop';

    const description = document.createElement('div');
    description.className = 'description';
    description.textContent = trackInfo.description;

    const status = document.createElement('div');
    status.className = 'status';
    status.textContent = 'Остановлено';

	const masterProgress =
    document.getElementById('masterProgress');

const masterTime =
    document.getElementById('masterTime');

    controls.appendChild(playBtn);
    controls.appendChild(stopBtn);
    controls.appendChild(description);
    controls.appendChild(status);

    const progressContainer = document.createElement('div');
    progressContainer.className = 'progress-container';

    const progress = document.createElement('progress');
    progress.className = 'progress';
    progress.value = 0;
    progress.max = 100;

    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = '00:00 / 00:00';

    progressContainer.appendChild(progress);
    progressContainer.appendChild(time);

    row.appendChild(controls);
    row.appendChild(progressContainer);

    container.appendChild(row);

    playBtn.addEventListener('click', () => {
        audio.play();
        status.textContent = 'Воспроизводится';
    });

    stopBtn.addEventListener('click', () => {
        audio.pause();
        audio.currentTime = 0;

        progress.value = 0;
        status.textContent = 'Остановлено';

        if (!isNaN(audio.duration)) {
            time.textContent =
                `00:00 / ${formatTime(audio.duration)}`;
        } else {
            time.textContent = '00:00 / 00:00';
        }
    });

    audio.addEventListener('loadedmetadata', () => {
        time.textContent =
            `00:00 / ${formatTime(audio.duration)}`;
    });

    audio.addEventListener('timeupdate', () => {
        if (!isNaN(audio.duration)) {
            progress.value =
                (audio.currentTime / audio.duration) * 100;

            time.textContent =
                `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
        }
    });

    audio.addEventListener('ended', () => {
        progress.value = 100;
        status.textContent = 'Завершено';
    });

    audio.addEventListener('pause', () => {
        if (!audio.ended && audio.currentTime > 0) {
            status.textContent = 'Пауза';
        }
    });

    audio.addEventListener('play', () => {
        status.textContent = 'Воспроизводится';
    });

});

masterAudio.addEventListener('loadedmetadata', () => {

    masterTime.textContent =
        `00:00 / ${formatTime(masterAudio.duration)}`;

});

masterAudio.addEventListener('timeupdate', () => {

    if (!isNaN(masterAudio.duration)) {

        masterProgress.value =
            (masterAudio.currentTime / masterAudio.duration) * 100;

        masterTime.textContent =
            `${formatTime(masterAudio.currentTime)} / ${formatTime(masterAudio.duration)}`;
    }

});
